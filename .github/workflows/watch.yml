name: VODKL ophthalmology watcher

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run watcher
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SPZ_RECIPIENT_EMAIL: ${{ secrets.SPZ_RECIPIENT_EMAIL }}
        run: python run_check.py

      - name: Publish to GitHub Pages
        run: |
          mkdir -p docs
          cp report.html docs/index.html

      - name: Commit updated state
        run: |
          git config user.name "vodkl-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/last_snapshot.json report.html docs/index.html
          test -f state/state.json && git add state/state.json
          git diff --cached --quiet || git commit -m "Update watcher state [skip ci]"
          git push
